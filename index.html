<!doctype html>
<html lang="fr" data-dir="a">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

<!-- C1 — circuit fermé. L'essai reste à 10 € sur tout le réseau ;
     cette page vit uniquement sur QR et campagnes, et ne doit jamais être trouvable. -->
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex" />

<title>Ta séance d'essai est offerte — Boxing Center</title>
<meta name="description" content="Une séance d'essai Boxing Center, habituellement à 10 €, offerte. Débutants acceptés, matériel prêté, aucune obligation d'inscription. Cinq salles à Toulouse." />
<meta name="theme-color" content="#080808" />
<meta name="color-scheme" content="dark" />

<link rel="preload" as="font" type="font/woff2" href="/fonts/bebas-neue-400-latin.woff2" crossorigin />
<link rel="preload" as="font" type="font/woff2" href="/fonts/montserrat-400-latin.woff2" crossorigin />
</head>

<body>
  <a class="skip" href="#formulaire">Aller au formulaire</a>

  <!-- La lumière du coin : un objet suspendu au-dessus de la page, pas un fond. -->
  <div class="light" aria-hidden="true">
    <div class="light__grain"></div>
    <div class="light__beam"></div>
    <div class="light__pool"></div>
    <canvas class="light__dust"></canvas>
  </div>

  <div class="bellflash" aria-hidden="true"></div>
  <div id="rail-slot"></div>

  <!-- Outils de maquette : retirés en production -->
  <aside class="tools" aria-label="Outils de maquette">
    <span class="tools__lab">Direction</span>
    <div role="radiogroup" aria-label="Direction artistique" style="display:flex;gap:4px">
      <button type="button" class="tools__b" role="radio" data-set-dir="a" aria-checked="true" title="A — Le coin">A</button>
      <button type="button" class="tools__b" role="radio" data-set-dir="b" aria-checked="false" title="B — Le laissez-passer">B</button>
      <button type="button" class="tools__b" role="radio" data-set-dir="c" aria-checked="false" title="C — La première fois">C</button>
    </div>
    <span class="tools__sep" aria-hidden="true"></span>
    <button type="button" class="tools__b" data-sound aria-pressed="false" title="Cloche de fin de round (désactivée par défaut)">♪̸</button>
  </aside>

  <main id="app"></main>

  <!-- Barre collante : +11 à +20,4 % mesurés. 64 % des mobiles ne dépassent pas le 1er écran. -->
  <div class="dock" id="dock">
    <div class="dock__in">
      <div class="dock__state">
        <span class="dock__price"><s>10 €</s><b>0 €</b></span>
        <span class="dock__meta" id="dock-meta">2 min · sans engagement</span>
      </div>
      <button type="button" class="btn btn--primary dock__cta" data-open-form>
        Je réserve ma séance<span class="btn__arrow" aria-hidden="true"></span>
      </button>
    </div>
  </div>

  <script type="module" src="/src/js/main.js"></script>
</body>
</html>
